name: bandpass_qc
version: 0.4
description: Inspect a dataset, apply a human-approved bandpass filter, run deterministic QC, and reflect on the result.
steps:
  - tool: inspect_dataset
  - tool: inspect_frequency
  - decision: recommend_bandpass
  - approval:
      required: true
  - tool: sufilter
  - tool: compare_datasets
  - decision: qc_reflection
    outcomes:
      - accept
      - adjust
  - approval:
      required_if: adjust
