provider: openclaw
fallback_provider: null

openclaw:
  # This project targets a Linux OCI VM. docker-compose uses host networking
  # so a host-local OpenClaw Gateway can stay bound to 127.0.0.1.
  base_url: http://127.0.0.1:18789/v1
  model: openclaw/default
  credential_env: OPENCLAW_GATEWAY_TOKEN
  # Optional explicit OpenClaw agent id. Leave null when model already routes it.
  agent_id: null

openai:
  model: gpt-5.6
  api_key_env: OPENAI_API_KEY
