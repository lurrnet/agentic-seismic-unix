provider: openclaw
fallback_provider: null

openclaw:
  # OpenClaw stays host-local and is never exposed directly to the Internet.
  # docker-compose currently retains host networking only because the Gateway
  # is bound to 127.0.0.1 on the OCI host.
  base_url: http://127.0.0.1:18789/v1
  model: openclaw/default
  credential_env: OPENCLAW_GATEWAY_TOKEN
  # Dedicated least-privilege agent for the public-facing seismic web app.
  agent_id: oci-seismic
  # Keep application-side routing so the model never owns SU execution.
  tool_strategy: application_routed

openai:
  model: gpt-5.6
  api_key_env: OPENAI_API_KEY

knowledge:
  # Local, read-only SU documentation retrieval. This does not grant OpenClaw
  # filesystem or web access; the application injects only bounded matches.
  enabled: true
  sudoc_path: /app/docs/sudoc
  max_docs: 3
  max_chars_per_doc: 5000

reflection:
  enabled: true
  auto_after_agent_filter: true
  max_preview_traces: 200
