services:
  seismic-agent:
    build:
      context: .
    image: seismic-agent-v0.2:arm64
    container_name: seismic-agent-v0.2
    restart: unless-stopped
    ports:
      - "8880:8880"
    command: streamlit run app.py --server.port=8880 --server.address=0.0.0.0
    volumes:
      - ./data:/data
