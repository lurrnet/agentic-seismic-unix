services:
  seismic-agent:
    build:
      context: .
    image: seismic-agent-v0.3.1:arm64
    container_name: agentic-seismic-unix
    restart: unless-stopped
    network_mode: host
    command: streamlit run app.py --server.port=8501 --server.address=0.0.0.0
    env_file:
      - path: .env
        required: false
    environment:
      AGENT_CONFIG_PATH: ${AGENT_CONFIG_PATH:-/app/config/agent.yaml}
      AGENT_PROVIDER: ${AGENT_PROVIDER:-}
    volumes:
      - ./data:/data
      - ./config:/app/config:ro
